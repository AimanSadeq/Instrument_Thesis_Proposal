# Render blueprint.
#
# NOT LIVE for the cohort-1 service. That service (srv-da588crm8hqs73bpp49g)
# was disconnected from its blueprint on 23 August 2026 and is managed from the
# Render dashboard. This file describes how to create the service; the
# dashboard is the source of truth for the running one.
#
# Reconnecting a blueprint with auto sync ON overwrites dashboard values from
# this file. That is what happened on 23 August: `DATABASE_SSL: verify` was
# pushed over a working `ca`, and every database call began failing with
# SELF_SIGNED_CERT_IN_CHAIN. Correct this file before reconnecting anything.
#
# Region is a United States region on purpose. The protocol discloses that
# hosting is in the United States; moving the service elsewhere would make a
# statement in the protocol untrue, so change this only if the protocol and the
# data management plan change with it.
services:
  - type: web
    name: instrument-platform
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    # Deploy by hand. A push that redeployed mid-programme could interrupt a
    # session, and there is no second chance at a day of collection.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: COLLECTION_TIMEZONE
        value: Asia/Riyadh
      - key: COHORT
        value: cohort-1
      # Training days in this cohort's programme. Four is what Research
      # Instruments v2.0 is written for; the September cohorts at the second
      # client are three. It decides the day selector, the day named in the
      # wording, and which day carries the cross-programme question R4. Two
      # cohorts of different lengths running in the same week need two
      # services, because this is read once at start-up.
      - key: PROGRAMME_DAYS
        value: "4"
      - key: INSTRUMENTS_OPEN
        value: "true"
      # Set these in the dashboard. They are never committed.
      - key: DATABASE_URL
        sync: false
      # Supabase presents a chain signed by its own root, which is not in
      # Node's trust store, so `verify` cannot work against it. `ca` trusts
      # exactly that one certificate and still verifies the connection fully.
      - key: DATABASE_SSL
        value: ca
      # Either a path to the certificate on the host, such as
      # /etc/secrets/prod-ca-2021.crt when it is added as a secret file, or the
      # certificate text itself. Set in the dashboard, because it depends on
      # how the host was set up. The service refuses to start if it cannot be
      # read, and says which of the two is wrong.
      - key: DATABASE_CA_CERT
        sync: false
      # Generated by Render, and different from each other by construction.
      # Read them from the Environment tab afterwards: the facilitator is
      # given ADMIN_SECRET and only ADMIN_SECRET.
      - key: ADMIN_SECRET
        generateValue: true
      - key: EXPORT_SECRET
        generateValue: true
      # The service's own hostname, so the QR codes on the admin page cannot
      # point at a mistyped address.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: instrument-platform
          property: host
