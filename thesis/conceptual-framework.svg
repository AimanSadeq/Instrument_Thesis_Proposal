<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <!-- DBR iteration loop (over the top) -->
  <path d="M 840 196 L 840 84 Q 840 60 816 60 L 184 60 Q 160 60 160 84 L 160 192"
        fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="500" y="44" text-anchor="middle" font-size="14.5" font-style="italic" fill="#1a1a1a">Design-Based Research iteration: analysis &#8594; design &#8594; implementation &#8594; reflection</text>
  <text x="500" y="80" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555555">Cycle 1 (naturalistic pilot) &#8594; systematic redesign &#8594; Cycle 2 (scaled delivery)</text>

  <!-- INTERVENTION box -->
  <rect x="40" y="200" width="240" height="160" rx="6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.4"/>
  <rect x="224" y="212" width="44" height="24" rx="12" fill="#1f3a5f"/>
  <text x="246" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">RQ1</text>
  <text x="56" y="232" font-size="11.5" letter-spacing="2" fill="#555555" font-family="Arial, sans-serif">INTERVENTION</text>
  <text x="56" y="266" font-size="19" font-weight="bold" fill="#1a1a1a">AI-Assisted</text>
  <text x="56" y="290" font-size="19" font-weight="bold" fill="#1a1a1a">Training Design</text>
  <text x="56" y="320" font-size="13" font-style="italic" fill="#444444">Multimedia learning (Mayer);</text>
  <text x="56" y="338" font-size="13" font-style="italic" fill="#444444">Clark &amp; Mayer; Gagn&#233;</text>

  <!-- flow arrow 1 -->
  <line x1="280" y1="280" x2="372" y2="280" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ENGAGEMENT box -->
  <rect x="380" y="200" width="240" height="160" rx="6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.4"/>
  <rect x="564" y="212" width="44" height="24" rx="12" fill="#1f3a5f"/>
  <text x="586" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">RQ2</text>
  <text x="396" y="232" font-size="11.5" letter-spacing="2" fill="#555555" font-family="Arial, sans-serif">ENGAGEMENT</text>
  <text x="396" y="266" font-size="19" font-weight="bold" fill="#1a1a1a">Gamification &amp;</text>
  <text x="396" y="290" font-size="19" font-weight="bold" fill="#1a1a1a">Simulation</text>
  <text x="396" y="320" font-size="13" font-style="italic" fill="#444444">Self-Determination Theory;</text>
  <text x="396" y="338" font-size="13" font-style="italic" fill="#444444">MDA framework</text>

  <!-- flow arrow 2 -->
  <line x1="620" y1="280" x2="712" y2="280" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- OUTCOME box (emphasized) -->
  <rect x="720" y="200" width="240" height="160" rx="6" fill="#e9eef4" stroke="#1a1a1a" stroke-width="2.6"/>
  <rect x="904" y="212" width="44" height="24" rx="12" fill="#1f3a5f"/>
  <text x="926" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">RQ4</text>
  <text x="736" y="232" font-size="11.5" letter-spacing="2" fill="#555555" font-family="Arial, sans-serif">OUTCOME</text>
  <text x="736" y="266" font-size="19" font-weight="bold" fill="#1a1a1a">Financial Competence</text>
  <text x="736" y="290" font-size="19" font-weight="bold" fill="#1a1a1a">Development</text>
  <text x="736" y="320" font-size="13" font-style="italic" fill="#444444">OECD/INFE frameworks;</text>
  <text x="736" y="338" font-size="13" font-style="italic" fill="#444444">Kirkpatrick NWKM evaluation</text>

  <!-- condition arrows (dashed, upward) -->
  <line x1="270" y1="452" x2="316" y2="368" stroke="#555555" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrg)"/>
  <line x1="730" y1="452" x2="684" y2="368" stroke="#555555" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrg)"/>
  <text x="255" y="420" text-anchor="end" font-size="12.5" font-style="italic" fill="#555555">enables / constrains</text>
  <text x="745" y="420" text-anchor="start" font-size="12.5" font-style="italic" fill="#555555">governs</text>

  <!-- ADOPTION condition box -->
  <rect x="100" y="460" width="340" height="110" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.4" stroke-dasharray="7 5"/>
  <rect x="384" y="470" width="44" height="24" rx="12" fill="#1f3a5f"/>
  <text x="406" y="487" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">RQ3</text>
  <text x="116" y="490" font-size="11.5" letter-spacing="2" fill="#555555" font-family="Arial, sans-serif">ENABLING CONDITION</text>
  <text x="116" y="519" font-size="17" font-weight="bold" fill="#1a1a1a">Organizational Adoption</text>
  <text x="116" y="546" font-size="13" font-style="italic" fill="#444444">TAM (Davis); UTAUT (Venkatesh et al.)</text>

  <!-- GOVERNANCE condition box -->
  <rect x="560" y="460" width="340" height="110" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.4" stroke-dasharray="7 5"/>
  <rect x="844" y="470" width="44" height="24" rx="12" fill="#1f3a5f"/>
  <text x="866" y="487" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">RQ5</text>
  <text x="576" y="490" font-size="11.5" letter-spacing="2" fill="#555555" font-family="Arial, sans-serif">ENABLING CONDITION</text>
  <text x="576" y="519" font-size="17" font-weight="bold" fill="#1a1a1a">Responsible-AI Governance</text>
  <text x="576" y="546" font-size="13" font-style="italic" fill="#444444">UNESCO; OECD AI Principles; KSA/UAE PDPL</text>
</svg>
